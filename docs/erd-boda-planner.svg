<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980">
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .entity { fill: #ffffff; stroke: #2f3a3d; stroke-width: 2; rx: 8; }
      .title { fill: #314246; font: 700 18px Arial, sans-serif; }
      .field { fill: #304045; font: 14px Arial, sans-serif; }
      .pk { fill: #9f3f52; font: 700 14px Arial, sans-serif; }
      .fk { fill: #356f78; font: 700 14px Arial, sans-serif; }
      .line { stroke: #596a6f; stroke-width: 2; fill: none; }
      .label { fill: #596a6f; font: 13px Arial, sans-serif; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1480" height="980"/>

  <rect class="entity" x="60" y="80" width="260" height="205"/>
  <text class="title" x="85" y="115">app_user</text>

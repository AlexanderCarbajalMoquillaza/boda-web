spring.application.name=planner

# Render asigna el puerto mediante la variable de entorno PORT
server.port=${PORT:8080}

# Configuracion de base de datos PostgreSQL (Neon / Local)
# Si no se definen variables de entorno, usa los valores por defecto locales
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/boda_planner}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate DDL: 'update' crea o actualiza las tablas automaticamente en Neon
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Clave secreta para JWT (puedes sobreescribirla en Render con APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET:boda-planner-secret-key-super-secure-change-in-production-2026}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}

# Origen permitido para CORS (soporta lista separada por comas o comodin *)
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5173,https://*.onrender.com}

# Configuracion opcional para crear el primer administrador al iniciar.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.full-name=${APP_ADMIN_FULL_NAME:Administrador}

# Limite para subida de imagenes y canciones
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

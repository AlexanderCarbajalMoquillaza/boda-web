# ============================================================
# Render Blueprint Specification
# Permite desplegar el Backend y Frontend juntos en Render con 1 clic
# ============================================================
services:
  # 1. Backend: Spring Boot 4 (Java 21 con Docker)
  - type: web
    name: boda-planner-backend
    runtime: docker
    dockerfilePath: ./planner/Dockerfile
    dockerContext: ./planner
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: DATABASE_URL
        sync: false # Pega aquí tu URL de conexión de Neon (ej: postgresql://... o jdbc:postgresql://...)
      - key: APP_JWT_SECRET
        generateValue: true # Render genera automáticamente una clave secreta segura
      - key: APP_JWT_EXPIRATION_MINUTES
        value: 120
      - key: APP_FRONTEND_ORIGIN
        value: "*" # Permite peticiones desde el frontend en Render
      - key: APP_ADMIN_EMAIL
        sync: false # Opcional: email del administrador inicial (ej: admin@boda.com)
      - key: APP_ADMIN_PASSWORD
        sync: false # Opcional: contraseña del administrador
      - key: APP_ADMIN_FULL_NAME
        value: Administrador

  # 2. Frontend: React + Vite (Static Site en CDN gratuita)
  - type: web
    name: boda-planner-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Pega aquí la URL de tu backend con /api (ej: https://boda-planner-backend.onrender.com/api)
